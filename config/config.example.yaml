# Gate 0.5 目标配置样例（对应 docs/dev/rebuild/12-gate0-inputs.md §3）。
# 机器校验：config/config.schema.json。
# 说明：当前 upstream 运行期仍读取仓库根 config.yaml 的原生键；P9-pre 起按本 schema 装配。
# 1 请求实例 = 1 账号 + 1 Context + 1 Page + 1 surface；同账号 chat/build 不得并存。

instances:
  # count/surface/min_tier 只在实例级；同一 account_id 可分别声明 chat 与 build，
  # 但两者不会同时存活。
  - account_id: primary
    count: 1
    surface: chat
    min_tier: free
  - account_id: primary
    count: 1
    surface: build
    min_tier: pro

# 全局只保留总上限；不做 channel/quota group/策略组。
limits:
  max_instances: 8

# 默认拒绝：[] 或缺失都表示所有 API 请求必须带 Key。
# 只有显式配置空字符串 [""] 才开放匿名访问；不保留 loopback 免鉴权。
api_keys: []

features:
  # P5 首批只要求 openai/gemini；claude/responses 在 Build 之后增量开启。
  formats:
    - openai
    - gemini
  build_surface: false

keepalive:
  enabled: true
  interval_hours: 24

logging:
  level: INFO
  daily_dir: logs
  retention_days: 7
  # upstream 原生转储开关保留，但 dump 只落 safe_*，禁止明文 headers/raw_body。
  dump_requests: false
  dump_to_file: false
  dump_dir: dumps

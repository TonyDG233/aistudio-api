# API 客户端调用鉴权密钥列表 (用于外部客户端调用 /v1beta/... 接口鉴权)
api_keys: []

# 对外 API 鉴权：默认关闭免密；空 api_keys 绝不开放
security:
  api_allow_anonymous: false

# 实例配置：1 实例 = 1 账号 + 1 BrowserContext + 1 Page + 1 surface
instances:
  - count: 1
    surface: chat
    only_tier: Free
  - count: 1
    surface: chat
    min_tier: Pro

# 全局实例/Context 上限（1-16）；缺省等于 instances count 之和。
max_contexts: 2

# 诊断开关（D-09）：snapshot hash 是否包含 executable_code / code_execution_result。
# 默认开启；出现严重路由异常时优先怀疑该 hash，可临时置 false 回退上游行为。
# 仅诊断用，不进入普通用户 UI；也可用 AISTUDIO_HASH_INCLUDE_CODE 环境变量覆盖。
diagnostics:
  hash_include_code: true

# 服务端日志与请求转储调试配置
logging:
  level: INFO
  dump_requests: false
  dump_to_file: false
  dump_dir: dumps

rotator:
  max_retries: 5
  # D-01 配额记账口径：account（默认，chat/build 共用额度）或 account_surface（分开）
  quota_scope: account
  cooldowns:
    rate_limited_short: 60
    rate_limited_drip: 300
    rate_limited_drip_extended: 600
    auth_error: 300

# P2 请求路由预算（只保留连续切号上限；无 defer/熔断/后台重排）
features:
  routing:
    max_switches: 2
    # 429 同账号首次重试前的退避秒数（0..30，默认 2.0），可用
    # AISTUDIO_RETRY_SAME_DELAY_SEC 环境变量覆盖。
    retry_same_delay_sec: 2.0
  # P6 保活：auth/metadata 默认 24h；active_activity 默认关闭（不启用 idle 回收）。
  keepalive:
    auth_update: true
    auth_update_hours: 24
    metadata_refresh: true
    metadata_refresh_hours: 24
    metadata_refresh_on_startup: true
    active_activity: false
    active_activity_seconds: 60

  # Protocol faces. OpenAI Chat Completions is part of P5; Claude/Responses
  # stay disabled until C3.
  formats:
    openai: true
    claude: false
    responses: false
    media:
      allow_private_urls: false

  # Anti-Truncation Gateway (synthetic tool transport). Default off; prefer
  # falls back to plain text, required fails explicitly when the synthetic call
  # is absent. mode_by_format overrides one protocol face.
  atg:
    mode: "off"
    mode_by_format:
      gemini: inherit
      openai: inherit
      claude: inherit
      responses: inherit
    tool_prefix: atg_emit_
    control_position: tail
    strict: false
    empty_retries: 2
    recovery: repair
    side_buffer_bytes: 0
    client_synthetic_guard: true
    max_response_bytes: 16777216
    text_model_pattern: ""
    non_text_model_pattern: ""

paid_model_rules:
  ultra_required:
    contains: ["veo", "ultra"]
    required_tiers: ["Ultra", "Ultra_20X"]
  pro_required:
    contains: ["argon", "gemini-4", "imagen"]
    required_tiers: ["Pro", "Ultra", "Ultra_20X"]

model_defaults:
  drop_unsupported_params: false
  profiles:
    - name: image_models
      match:
        contains:
          - image
          - imagen
      is_image_model: true
      default_tools:
        - google_search_and_image_search
      generation_config_defaults:
        response_mime_type: null
        image_output_mode: image_only
        thinking_config:
          level: MINIMAL
          mode: 1
      clear_generation_config_indexes:
        - 7
        - 13
        - 17
      disable_safety_settings: true
    - name: video_models
      match:
        prefixes:
          - veo-
        contains:
          - veo
      disable_safety_settings: true
    - name: gemma_models
      match:
        prefixes:
          - gemma-
      default_tools:
        - google_search
      safety_settings:
        Harassment: 5
        Hate: 5
        Sexually Explicit: 5
        Dangerous Content: 5
    - name: gemini_models
      match:
        prefixes:
          - gemini-
      default_tools:
        - google_search
      safety_settings:
        Harassment: 5
        Hate: 5
        Sexually Explicit: 5
        Dangerous Content: 5
      drop_unsupported_params: true
  models: {}

tier_quotas:
  Free:
    flash_models:
      match:
        contains: ["flash"]
      daily_limit: 100
    pro_models:
      match:
        contains: ["pro"]
      daily_limit: 10
    default_limit: 20
  Plus:
    flash_models:
      match:
        contains: ["flash"]
      daily_limit: 300
    pro_models:
      match:
        contains: ["pro"]
      daily_limit: 30
    default_limit: 50
  Pro:
    argon_models:
      match:
        contains: ["argon", "gemini-4"]
      daily_limit: 50
    flash_models:
      match:
        contains: ["flash"]
      daily_limit: 150
    pro_models:
      match:
        contains: ["pro"]
      daily_limit: 50
    image_models:
      match:
        contains: ["image", "imagen"]
      daily_limit: 50
    default_limit: 50
  Ultra:
    argon_models:
      match:
        contains: ["argon", "gemini-4"]
      daily_limit: 250
    flash_models:
      match:
        contains: ["flash"]
      daily_limit: 1500
    pro_models:
      match:
        contains: ["pro"]
      daily_limit: 250
    image_models:
      match:
        contains: ["image", "imagen"]
      daily_limit: 250
    video_models:
      match:
        contains: ["veo"]
      daily_limit: 50
    default_limit: 250
  Ultra_20X:
    argon_models:
      match:
        contains: ["argon", "gemini-4"]
      daily_limit: 1000
    flash_models:
      match:
        contains: ["flash"]
      daily_limit: 5000
    pro_models:
      match:
        contains: ["pro"]
      daily_limit: 1000
    image_models:
      match:
        contains: ["image", "imagen"]
      daily_limit: 1000
    video_models:
      match:
        contains: ["veo"]
      daily_limit: 200
    default_limit: 1000
  overrides: {}

account_presets:
  - id: preset_all
    name: 全部启用 (最大并发)
    description: 激活所有可用账号，提供最充沛的并发与负载池
    action: enable_all
    is_system: true
  - id: preset_paid_only
    name: 纯高阶付费池 (Plus/Pro/Ultra)
    description: 仅激活具有付费权益的账号，全力保障高阶模型调用
    action: filter_tier
    target_tiers: ["Plus", "Pro", "Ultra", "Ultra_20X"]
    is_system: true
  - id: preset_ultra_only
    name: 旗舰专属池 (Ultra 独占)
    description: 仅激活 Ultra 顶级算力账号，保障最顶尖模型调用
    action: filter_tier
    target_tiers: ["Ultra", "Ultra_20X"]
    is_system: true
  - id: preset_free_only
    name: 纯免费节能池 (Free)
    description: 仅激活 Free 等级账号，用于日常普通模型测试
    action: filter_tier
    target_tiers: ["Free"]
    is_system: true
  - id: preset_production
    name: 生产专属集群 (Production)
    description: 仅激活 group 标记为 production 的核心业务账号
    action: filter_group
    target_groups: ["production"]
    is_system: true

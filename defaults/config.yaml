# API 客户端调用鉴权密钥列表 (用于外部客户端调用 /v1beta/... 接口鉴权)
# 留空 [] 表示对外 API 免 Key 开放调用；配置密钥后客户端必须携带对应 Key 访问。
api_keys: []

# ============================================================================
# 功能开关 (features) — 编排/fallback/活动类默认关闭；WP10 凭证与账号信息保活默认开启。
# 本段可在 Web 管理控制台可视化编辑并热重载 (PUT /config/yaml -> 立即生效)，
# 无需重启进程。同名环境变量 (AISTUDIO_*) 仅作为启动基线兜底：
# 优先级为 本段 features.* > AISTUDIO_* 环境变量 > 内置默认值。
# ============================================================================
features:
  # Build 页面直连面总开关 (对应 Ark MAKERSUITE_DIRECT / 环境变量 AISTUDIO_BUILD_SURFACE)。
  # 开=free 档账号走 Build 宿主页直连通道；关=仅使用现有聊天面 (零行为变化)。
  # 何时开：需要通过免费档账号调用 Build 专属额度时。失败怎么办：面内失败显式报错，不改道。
  build_surface: false

  # 是否按账号档位 (tier) 路由到不同面 (对应环境变量 AISTUDIO_ROUTE_BY_TIER)。
  # 开=按 features.groups/档位策略把请求分发到允许的面；关=始终使用聊天面默认路由。
  route_by_tier: false

  # 批量账号信息刷新 (email/tier/过期) 的并发工作池大小 (对应 Ark REFRESH_CONCURRENCY)。
  # 越大刷新越快但并发请求越多；默认 3 为 Ark 实测的稳妥值。失败怎么办：单账号失败不影响其余。
  account_refresh_concurrency: 3

  # 定时自动切换账号总开关 (对应 Ark ENABLE_AUTO_SWITCH / 环境变量 AISTUDIO_AUTO_SWITCH)。
  # 开=按下方间隔周期性轮换账号；关=仅按用量/失败/冷却触发切换。默认关，避免打扰。
  auto_switch: false

  # 自动切换周期间隔 (小时，支持小数，最小 0.1；对应 Ark AUTO_SWITCH_INTERVAL_HOURS)。
  # 仅在 auto_switch=true 时生效；默认 3 小时与 Ark 一致。
  # 选号规则：优先切到 auth_saved_at 最久未回写的可用账号，兼顾均衡与凭证保活。
  auto_switch_interval_hours: 3.0

  # 自动刷新 Auth / 凭证回写 (对应 Ark ENABLE_AUTH_UPDATE，默认开)。
  # 开=把浏览器当前 cookies/origins 原子合并写回 per-account auth.json；
  # 触发：切号前、切号后、初始化/重连、下方 24h 周期、浏览器关闭前。
  # 关=仅保留现有登录/切号时的自然回写。此开关不写 meta。
  keepalive_auth_update: true

  # 凭证回写周期 (小时，最小 0.1；默认 24h，对齐 Ark 健康巡检)。
  # 仅作用于当前活跃账号；非活跃账号在 auto_switch 轮转到它时回写。
  keepalive_auth_update_hours: 24.0

  # 自动更新账号信息 (tier/email/expired，默认开；写 registry.json/meta.json)。
  # 与手动 POST /accounts/refresh 共用同一刷新器与 409 互斥；失败不误杀账号。
  keepalive_metadata_refresh: true

  # 账号信息刷新周期 (小时，最小 0.1；默认 24h)。
  keepalive_metadata_refresh_hours: 24.0

  # 启动时是否补刷缺失/过期的账号信息 (默认开)；只刷到期账号，不阻塞启动。
  keepalive_metadata_refresh_on_startup: true

  # 活跃页轻量活动 (默认关)。开=周期滚动页面并刷新空闲计时器，保持当前会话活跃；
  # 代价是浏览器不会被空闲回收。凭证保活本身不依赖此开关。
  keepalive_active_activity: false

  # 活跃页活动间隔 (秒，最小 10；默认 60)。
  keepalive_active_activity_seconds: 60.0

  # --------------------------------------------------------------------------
  # OpenAI / Claude 协议面 (WP8)。默认开启（对齐 Ark 无条件端点注册）；
# 仍保留开关用于运维临时关闭。
  # openai: 控制 /v1/chat/completions 与 /v1/models。
  # claude: 控制 /v1/messages（count_tokens 仍显式 404，不伪造估算）。
  # media.allow_private_urls: 允许代理下载私网/回环图片 URL；默认 false 防 SSRF。
  # --------------------------------------------------------------------------
  formats:
    openai: true
    claude: true
    media:
      allow_private_urls: false

  # --------------------------------------------------------------------------
  # 账号分组与面编排 (groups，WP5) — 按账号档位 (tier) / 邮箱正则把账号分组，
  # 为每组指定允许的面 (chat/build) 与页面上限。未显式分组的账号由编排器按
  # tier 默认规则兜底 (free→build、pro/ultra/plus→chat)，本段留空即全部走默认。
  # --------------------------------------------------------------------------
  # 每个分组字段：
  #   name:                 组名 (缺省按序号 group-N)
  #   match_tier:           命中的账号档位列表 (小写，如 pro/free/ultra/plus)
  #   match_emails_regex:   命中的邮箱正则 (可选，留空/null 表示不启用)
  #   allowed_surfaces:     允许的面子集 [chat] / [build] / [chat, build]；空 [] 表示禁用该组
  #   max_page_instances:   该组允许并存的页面实例上限 (0-16，默认 2)；超限对请求显式拒绝，不排队
  # 示例 (两行)：
  # groups:
  #   - { name: pro,  match_tier: [pro, ultra, plus], allowed_surfaces: [chat],  max_page_instances: 2 }
  #   - { name: free, match_tier: [free],             allowed_surfaces: [build], max_page_instances: 3 }
  groups: []

  # --------------------------------------------------------------------------
  # ATG (Anti-Truncation Gateway) 防截断合成工具通道
  # 通过合成 function-call 通道承载模型答案，绕过文本通道截断/审核后再解包回正文。
  # 全部默认关闭；仅 mode 不为 off 时模块才启用。字段名对齐 Ark ATG_* 语义。
  # --------------------------------------------------------------------------
  atg:
    # 运行模式 (对应 Ark ATG_MODE / 环境变量 AISTUDIO_ATG_MODE)。
    # off=完全禁用 (零管线改动)；prefer=尽力合成，模型忽略合成工具时回退纯文本通道；
    # required=严格模式，缺少合成工具调用时显式失败而非静默回退。
    # 何时用：prefer 用于观察命中率；required 用于必须走工具通道的强约束场景。
    mode: off

    # 分协议面覆盖 (WP8)：inherit 使用上方 mode；off/prefer/required 单独覆盖。
    # 仅在对应协议面 (openai/claude) 开启后生效。
    mode_by_format:
      gemini: inherit
      openai: inherit
      claude: inherit

    # 每次请求的合成工具名前缀 (对应 Ark ATG_TOOL_PREFIX)，须保持稳定以利于过滤与历史清理。
    tool_prefix: atg_emit_

    # 控制提示词的注入位置 (对应 Ark ATG_CONTROL_POSITION)。
    # tail=置于对话末尾 (推荐，同时修复“模型话轮提前结束”问题)；head=置于对话开头。
    control_position: tail

    # 合成工具参数严格模式 (对应 Ark ATG_TOOL_STRICT)。
    # 开=参数结构不符合预期即判失败；关=允许宽松解析。默认关，容错优先。
    strict: false

    # 上游返回空/塌陷响应时的最大重试次数 (对应 Ark ATG_EMPTY_RETRIES，范围 0-5)。
    # 开大=更强的防截断兜底但增加额度消耗；默认 2。
    empty_retries: 2

    # 合成参数解析失败时的恢复策略 (对应 Ark ATG_RECOVERY)。
    # repair=尝试确定性修复后再解包；fail=直接显式失败。默认 repair。
    recovery: repair

    # 流式旁路缓冲字节数 (对应 Ark ATG_SIDE_BUFFER_BYTES，0..16MB)。
    # 0=立即透传 (默认)；大于 0=在合成调用到达前先缓冲纯文本，抑制前言泄漏。失败怎么办：超限即透传。
    side_buffer_bytes: 0

    # 客户端自带合成机制守卫 (对应 Ark ATG_CLIENT_SYNTHETIC_GUARD，默认 on)。
    # 开=当客户端 (如酒馆类扩展) 已自带“经工具回正文”机制时跳过本地包装，防止双通道叠加；
    # 关=无条件本地包装。默认开，兼容优先。
    client_synthetic_guard: true

    # 合成参数最大字节数 (对应 Ark ATG_MAX_RESPONSE_BYTES，范围 1KB..100MB)。
    # 超过该上限的合成参数直接判失败，避免异常大载荷拖垮解析；默认 16MB。
    # 失败怎么办：超限即判失败（不静默截断）。
    max_response_bytes: 16777216

    # 文本模型识别正则 (对应 Ark ATG_TEXT_MODEL_PATTERN)；留空使用内置默认正则。
    # 命中的模型视为文本模型，才参与 ATG 合成。失败怎么办：留空即用内置规则。
    text_model_pattern: ""

    # 非文本模型识别正则 (对应 Ark ATG_NON_TEXT_MODEL_PATTERN)；留空使用内置默认正则。
    # 优先于文本正则判定：命中即视为非文本模型 (生图/音频/嵌入等) 并跳过 ATG。
    non_text_model_pattern: ""

  # --------------------------------------------------------------------------
  # 回落 (fallback) 开关组 — 默认全 off，遵循「零自动回落」决策。
  # 任何改道行为都必须显式开启，并在日志与响应中可 grep；未开启时一律显式报错。
  # --------------------------------------------------------------------------
  fallback:
    # 配额 (429/限额) 耗尽时是否允许跨面/跨账号回落。开=配额触顶后尝试回落改道；关=显式报错。默认关。
    on_quota: false

    # 请求失败 (非配额类错误) 时是否允许自动回落改道。开=失败即改道重试；关=显式报错。默认关。
    on_failure: false

    # 是否允许在 chat 与 build 两个面之间跨面回落。开=允许跨面改道；关=面内失败不改道。默认关。
    cross_surface: false

# 服务端日志与请求转储调试配置
logging:
  # 日志输出级别: DEBUG / INFO / WARNING / ERROR
  level: INFO
  # 是否转储每次 API 请求与响应的完整报文详情 (支持通过环境变量 DEBUG=true 触发)
  dump_requests: false
  # 是否将请求与响应转储落盘为独立文件 (支持环境变量 AISTUDIO_DUMP_FILE=true 触发)
  dump_to_file: false
  # 转储文件保存目录 (默认为项目根目录下 dumps/)
  dump_dir: dumps

model_defaults:
  # 是否自动丢弃下游客户端传入的未知/不支持参数（如 HARM_CATEGORY_CIVIC_INTEGRITY、不兼容的内置工具等）
  # 设置为 true 时自动过滤异常参数，避免 Google 上游返回 400 INVALID_ARGUMENT 报错
  drop_unsupported_params: false

  # profiles: 按模型名规则匹配，适合整类模型共用默认配置
  profiles:
    # 生图模型默认配置
    - name: image_models
      match:
        contains:
          - image
      # 命中后视为生图模型
      is_image_model: true
      # 生图模型可选内置工具名：
      # - google_search                    仅网页搜索
      # - image_search                     仅图片搜索
      # - google_search_and_image_search   网页搜索 + 图片搜索
      default_tools:
        - google_search_and_image_search
      # generation_config_defaults 会映射到内部 wire generation_config
      generation_config_defaults:
        # 生图通常不需要显式 response mime type
        response_mime_type: null
        # image_only 或 text_and_image
        image_output_mode: image_only
        # thinking_config 最终会编码成 wire 数组
        thinking_config:
          # LOW / MEDIUM / HIGH / MINIMAL
          level: MINIMAL
          mode: 1
      # 某些生图模型不接受这些 generation_config 下标，发请求前会清空
      clear_generation_config_indexes:
        - 7
        - 13
        - 17
      # 当前生图模型默认不下发 safety_settings
      disable_safety_settings: true

    # Gemma 文本模型默认配置
    - name: gemma_models
      match:
        prefixes:
          - gemma-
      # Gemma 系列只能选这两个内置工具：
      # - google_search
      # - code_execution
      default_tools:
        - google_search
      # 1 = 最严格拦截
      # 5 = 关闭
      safety_settings:
        Harassment: 5
        Hate: 5
        Sexually Explicit: 5
        Dangerous Content: 5

    # Gemini 文本模型默认配置
    - name: gemini_models
      match:
        prefixes:
          - gemini-
      # Gemini 系列可选 4 个内置工具：
      # - google_search
      # - code_execution
      # - google_maps
      # - url_context
      default_tools:
        - google_search
      safety_settings:
        Harassment: 5
        Hate: 5
        Sexually Explicit: 5
        Dangerous Content: 5
      # 自动丢弃下游客户端传入的未知/非法参数（如 HARM_CATEGORY_CIVIC_INTEGRITY），防止上游 400 报错
      drop_unsupported_params: true

  # models: 对单个模型做精确覆盖，优先级高于上面的 profiles
  # 例如：
  # models:
  #   gemini-3.1-flash-image-preview:
  #     generation_config_defaults:
  #       image_output_mode: text_and_image
  #       media_resolution: HIGH
  models: {}
